name: Standalone Skill CI

on:
  pull_request:
  push:
    branches: [main, 'integration/**', 'codex/**']

permissions:
  contents: read

concurrency:
  group: skill-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-package:
    name: Standalone Skill (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.2.1
      - run: python -m pytest -q tests/test_review_skill_packaging.py
